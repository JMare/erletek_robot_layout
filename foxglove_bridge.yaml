# foxglove_bridge parameters for the print_mission layout (print_mission.layout.json).
#
# One change from the bridge defaults:
#   include_hidden       true: the action feedback topics (.../_action/feedback) are hidden
#                        topics. The "Print progress" plot reads one of them.
#
# The layout shows no robot model, so the bridge sends no mesh files: the default
# asset_uri_allowlist is sufficient.
#
# ros2 run foxglove_bridge foxglove_bridge --ros-args --params-file <this file>
#
# The container cannot read this file. README.md gives the same parameter on the command
# line, and a "docker cp" alternative.
/**:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    include_hidden: true
